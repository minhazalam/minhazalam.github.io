name: Deploy to GitHub Pages

on:
  push:
    branches: [main, feature/data-pipeline-design]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/checkout@v4
        with:
          ref: feature/data-pipeline-design
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: production/frontend/yarn.lock
      - name: Build production site from main
        working-directory: production/frontend
        env:
          PUBLIC_URL: .
        run: |
          corepack yarn install --frozen-lockfile
          corepack yarn build
      - name: Build development preview
        working-directory: preview/frontend
        env:
          PUBLIC_URL: /preview
          REACT_APP_DEPLOY_TARGET: preview
        run: |
          corepack yarn install --frozen-lockfile
          corepack yarn build
      - name: Combine production and preview sites
        run: |
          mkdir -p production/frontend/build/preview
          cp -R preview/frontend/build/. production/frontend/build/preview/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
